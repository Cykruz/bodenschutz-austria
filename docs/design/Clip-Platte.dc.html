<style>
body{margin:0;font-family:'Nunito Sans',Verdana,sans-serif;color:#1E3A2F}
@keyframes drop{0%{opacity:0;transform:translateY(-90px)}10%{opacity:1;transform:translateY(0)}66%{opacity:1;transform:translateY(0)}78%{opacity:1;transform:translateY(-110px)}86%,100%{opacity:0;transform:translateY(-120px)}}
@keyframes truck{0%,24%{transform:translateX(-260px)}44%,58%{transform:translateX(70px)}70%,100%{transform:translateX(420px)}}
@keyframes press{0%,40%{transform:translateY(0)}46%,56%{transform:translateY(4px)}62%,100%{transform:translateY(0)}}
@keyframes grass{0%,70%{fill:#B9A98A}82%,100%{fill:#7FB069}}
@keyframes label1{0%,2%{opacity:0}5%,28%{opacity:1}32%,100%{opacity:0}}
@keyframes label2{0%,32%{opacity:0}36%,66%{opacity:1}70%,100%{opacity:0}}
@keyframes label3{0%,70%{opacity:0}74%,96%{opacity:1}100%{opacity:0}}
.a{animation-duration:9s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.4,0,.2,1)}
.p1{animation-name:drop;animation-delay:0s}.p2{animation-name:drop;animation-delay:.25s}.p3{animation-name:drop;animation-delay:.5s}.p4{animation-name:drop;animation-delay:.75s}.p5{animation-name:drop;animation-delay:1s}
.truck{animation-name:truck}
.ground{animation-name:grass}
.l1{animation-name:label1}.l2{animation-name:label2}.l3{animation-name:label3}
.stage{animation:press 9s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.a,.stage{animation:none}.p1,.p2,.p3,.p4,.p5{opacity:1;transform:none}.truck{transform:translateX(70px)}.l2{opacity:1}}
</style>

</g>
