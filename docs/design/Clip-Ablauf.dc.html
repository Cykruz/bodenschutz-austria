<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mini-Clip: Vom Foto zum Angebot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Nunito+Sans:wght@600;700&display=swap">
<style>
body{margin:0;font-family:'Nunito Sans',Verdana,sans-serif;color:#1E3A2F}
@keyframes shutter{0%,8%{opacity:0}10%{opacity:1}14%{opacity:0}100%{opacity:0}}
@keyframes photoIn{0%,9%{opacity:0;transform:scale(0.92)}13%,34%{opacity:1;transform:scale(1)}38%,100%{opacity:0;transform:scale(0.96)}}
@keyframes numberIn{0%,36%{opacity:0;transform:translateY(16px)}41%,64%{opacity:1;transform:translateY(0)}68%,100%{opacity:0;transform:translateY(-10px)}}
@keyframes envelopeFly{0%,66%{opacity:0;transform:translate(0,0) scale(0.7)}70%{opacity:1;transform:translate(0,0) scale(1)}86%{opacity:1;transform:translate(250px,-40px) scale(1)}90%,100%{opacity:0;transform:translate(260px,-44px) scale(0.6)}}
@keyframes inboxPop{0%,86%{transform:scale(1)}89%{transform:scale(1.06)}92%,100%{transform:scale(1)}}
@keyframes checkIn{0%,88%{opacity:0;transform:scale(0.4) rotate(-20deg)}92%,97%{opacity:1;transform:scale(1) rotate(0)}100%{opacity:0}}
@keyframes stepDot{0%{background:#E6EDE3}1%,100%{background:#D97B2A}}
@keyframes bar{0%{width:0}100%{width:100%}}
.loop{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.shutter{animation-name:shutter}
.photo{animation-name:photoIn}
.number{animation-name:numberIn}
.envelope{animation-name:envelopeFly}
.inbox{animation-name:inboxPop}
.check{animation-name:checkIn}
.bar{animation:bar 8s linear infinite}
@media (prefers-reduced-motion: reduce){.loop,.bar{animation:none}.photo,.number{opacity:1;transform:none}.envelope{opacity:1;transform:translate(250px,-40px)}}
</style>
</helmet>
<div style="width:640px;height:400px;box-sizing:border-box;background:#1E3A2F;border-radius:28px;padding:28px 32px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden;color:#F6F3EC">
<div style="display:flex;justify-content:space-between;align-items:center">
<p style="margin:0;font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#F0A85A">Mini-Clip 01 · 8 Sekunden</p>
<p style="margin:0;font-family:'Nunito',Verdana,sans-serif;font-size:18px;font-weight:900">Vom Foto zum Angebot</p>
</div>
<div style="position:relative;flex:1">
<!-- Handy -->
<div style="position:absolute;left:0;top:0;width:190px;height:270px;background:#F6F3EC;border-radius:26px;border:6px solid #27493B;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center">
<div class="loop photo" style="position:absolute;inset:12px;border-radius:16px;background:#8A7A5C;display:flex;align-items:flex-end;justify-content:center;overflow:hidden"><div style="position:absolute;left:0;right:0;bottom:0;height:46%;background:#6E5F45"></div><div style="position:absolute;left:18px;bottom:22px;width:60px;height:60px;border-radius:50%;background:#5C4F38;opacity:0.7"></div><span style="position:relative;margin-bottom:10px;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#F6F3EC;background:rgba(30,58,47,0.85);padding:6px 10px;border-radius:999px">Untergrund: Schotter</span></div>
<div class="loop shutter" style="position:absolute;inset:0;background:#F6F3EC"></div>
<div class="loop number" style="position:absolute;inset:12px;border-radius:16px;background:#E6EDE3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#1E3A2F"><span style="font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#B9621C">120 m²</span><span style="font-family:'Nunito',Verdana,sans-serif;font-size:44px;font-weight:900;line-height:1">46</span><span style="font-size:13px;font-weight:700">Platten</span><span style="font-family:'Nunito',Verdana,sans-serif;font-size:28px;font-weight:900;line-height:1;margin-top:6px">2</span><span style="font-size:13px;font-weight:700">Paletten</span></div>
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1E3A2F" stroke-width="1.8" aria-hidden="true" style="position:relative"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
</div>
<!-- Umschlag -->
<div class="loop envelope" style="position:absolute;left:210px;top:120px;width:64px;height:44px;background:#D97B2A;border-radius:8px;display:flex;align-items:center;justify-content:center"><svg width="40" height="28" viewBox="0 0 40 28" fill="none" stroke="#1E3A2F" stroke-width="2.5" aria-hidden="true"><rect x="2" y="2" width="36" height="24" rx="4"/><path d="M3 5l17 12L37 5"/></svg></div>
<!-- Pfeil -->
<svg style="position:absolute;left:215px;top:60px" width="220" height="60" viewBox="0 0 220 60" fill="none" aria-hidden="true"><path d="M4 50 C 70 10, 150 10, 214 44" stroke="#2F5A47" stroke-width="3" stroke-dasharray="6 8"/></svg>
<!-- Posteingang Mario -->
<div class="loop inbox" style="position:absolute;right:0;top:40px;width:200px;background:#F6F3EC;color:#1E3A2F;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box">
<p style="margin:0;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#B9621C">Bei Mario</p>
<p style="margin:0;font-family:'Nunito',Verdana,sans-serif;font-size:18px;font-weight:900;line-height:1.1">Anfrage sortiert</p>
<div style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#44524A"><span>Baustelle · 120 m²</span><span>46 Platten · 2 Paletten</span><span>Stapler vorhanden</span></div>
<div style="display:flex;align-items:center;gap:8px;margin-top:4px"><span class="loop check" style="width:26px;height:26px;border-radius:50%;background:#2F5A47;display:inline-flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F6F3EC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 7"/></svg></span><span style="font-size:12px;font-weight:700">Freigeben</span></div>
</div>
<!-- Schrittleiste -->
<div style="position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;font-size:12px;font-weight:700;color:#C9D6CC"><span>Foto</span><span style="flex:1;height:4px;background:#27493B;border-radius:2px;overflow:hidden;display:block"><span class="bar" style="display:block;height:100%;background:#D97B2A"></span></span><span>Mengen</span><span style="width:24px;height:4px;background:#27493B;border-radius:2px;display:block"></span><span>Anfrage</span><span style="width:24px;height:4px;background:#27493B;border-radius:2px;display:block"></span><span>Mario</span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":400}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
