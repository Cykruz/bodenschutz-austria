# nginx-Beispiel für Bodenschutz Austria (Alternative zu Caddy). Domain anpassen, Zertifikat über Certbot.
# API läuft auf 127.0.0.1:4000, Website auf 127.0.0.1:3000 (Ports in docker-compose.yml lokal veröffentlichen).

server {
    listen 80;
    listen [::]:80;
    server_name bodenschutz-austria.at www.bodenschutz-austria.at;
    return 301 https://bodenschutz-austria.at$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bodenschutz-austria.at;
    # ssl_certificate und ssl_certificate_key trägt Certbot ein
    return 301 https://bodenschutz-austria.at$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bodenschutz-austria.at;
    # ssl_certificate /etc/letsencrypt/live/bodenschutz-austria.at/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bodenschutz-austria.at/privkey.pem;

    client_max_body_size 12m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;

    # Optional: Verwaltung nur aus bestimmten Netzen
    # location ~ ^/(admin|api/admin) {
    #     allow 203.0.113.5;
    #     deny all;
    #     proxy_pass http://127.0.0.1:3000;   # bzw. 4000 für /api/admin
    # }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
